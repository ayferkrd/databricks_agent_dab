bundle:
  name: simple_chatbot
variables:
  catalog_name:
    description: "Per-user lab catalog, e.g. labuser_matthew_mccoy"
    default: # <---- Update with your catalog name
  warehouse_id:
    description: "SQL warehouse the SQL MCP runs queries on"
    lookup:
      warehouse: "shared_warehouse"
resources:
  experiments:
    chatbot_experiment:
      name: /Users/${workspace.current_user.userName}/simple-chatbot-experiment
  apps:
    simple_chatbot:
      name: agent-${workspace.current_user.id}-${bundle.target}
      description: "Simple chatbot agent"
      source_code_path: ./
      # User authorization: forward the caller's token so the app can resolve
      # their identity (defaults to identity-only scopes: iam.current-user:read).
      user_api_scopes: []
      resources:
        - name: model-service
          uc_securable:
            securable_full_name: labuser_ayfer_kucukerdonmez.agent_deployment.agent-model
            securable_type: MODEL_SERVICE
            permission: EXECUTE
        - name: listings-table
          uc_securable:
            securable_full_name: labuser_ayfer_kucukerdonmez.agent_deployment.sf_airbnb_listings
            securable_type: TABLE
            permission: SELECT
        - name: app-experiment
          experiment:
            experiment_id: ${resources.experiments.chatbot_experiment.id}
            permission: CAN_EDIT
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
targets:
  dev:
    mode: development
    default: true